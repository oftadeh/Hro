# ساخت اپ اندروید کی‌فیت با Capacitor
# - هر بار که پوشه‌ی mobile تغییر کند یا از تب Actions دستی اجرا شود
# - خروجی: APK آزمایشی (debug) و اگر کلید امضا در Secrets باشد، APK و AAB نهایی امضاشده
# Secrets اختیاری برای نسخه‌ی نهایی: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android (Capacitor)

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'web/public/icon-*.png'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Android SDK روی ubuntu-latest از قبل نصب است (ANDROID_HOME)

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npm run android:add

      - name: Icons and splash
        run: npm run icons

      - name: Sync
        run: npm run android:sync

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keyfit-debug-${{ env.VERSION_NAME }}
          path: mobile/android/app/build/outputs/apk/debug/*.apk

      - name: Build and sign release
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: mobile/android
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/keyfit.jks"
          ./gradlew --no-daemon assembleRelease bundleRelease
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          mkdir -p "$RUNNER_TEMP/out"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/keyfit.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "$RUNNER_TEMP/out/keyfit-$VERSION_NAME.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$RUNNER_TEMP/out/keyfit-$VERSION_NAME.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/keyfit-$VERSION_NAME.aab"
          jarsigner -storepass:env KS_PASS -keypass:env KEY_PASS -keystore "$RUNNER_TEMP/keyfit.jks" "$RUNNER_TEMP/out/keyfit-$VERSION_NAME.aab" "$KEY_ALIAS"
          rm -f "$RUNNER_TEMP/keyfit.jks"

      - name: Upload release
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keyfit-release-${{ env.VERSION_NAME }}
          path: ${{ runner.temp }}/out/*
