<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>کی‌فیت</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; background: #131118; color: #eeebf3; font-family: Vazirmatn, Tahoma, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { font-size: 15px; line-height: 1.9; color: #c9c2d6; margin: 0 0 24px; }
  button { font: inherit; font-weight: 700; font-size: 16px; border: 0; border-radius: 999px; padding: 14px 32px; background: #d4ff3a; color: #131118; }
  .dot { width: 64px; height: 64px; border-radius: 20px; margin: 0 auto; background: linear-gradient(135deg, #9b7bfe, #f0a6d0); }
</style>
</head>
<body>
  <main>
    <div class="dot" aria-hidden="true"></div>
    <h1>اتصال به اینترنت برقرار نیست</h1>
    <p>کی‌فیت برای نمایش باشگاه‌ها، بلیت‌ها و پیام‌ها به اینترنت نیاز دارد.<br />اتصال را بررسی کنید و دوباره تلاش کنید.</p>
    <button type="button" onclick="location.href='https://keyfitapp.ir/'">تلاش دوباره</button>
  </main>
</body>
</html>
